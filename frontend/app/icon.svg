<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="0.6" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <!-- Open-end jaw cut out of the wrench head -->
    <mask id="jaw">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="28" y="3" width="8" height="14" rx="1.5" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g transform="rotate(45 32 32)" fill="#fff">
    <g mask="url(#jaw)">
      <circle cx="32" cy="17" r="12"/>
    </g>
    <rect x="27.5" y="22" width="9" height="31" rx="4.5"/>
    <circle cx="32" cy="47.5" r="2" fill="#2563eb"/>
  </g>
</svg>
